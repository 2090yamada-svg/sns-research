{% assign rows = include.data | split: "|" %}<figure class="chart" role="img" aria-label="{{ include.title }}"><p><strong>{{ include.title }}</strong></p>{% for r in rows %}{% assign kv = r | split: ":" %}{% assign pct = kv[1] | times: 100.0 | divided_by: include.max %}<div class="bar"><span>{{ kv[0] }}</span><b style="width:calc({{ pct }}% * .6)"></b><span>{{ kv[1] }}{{ include.unit }}</span></div>{% endfor %}<figcaption>{{ include.caption }}</figcaption></figure>
