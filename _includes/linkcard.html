<a class="linkcard" href="{{ include.url }}" target="_blank" rel="noopener">{% if include.image %}<img src="{{ include.image | relative_url }}" alt="" loading="lazy">{% endif %}<span class="lc-body"><span class="lc-title">{{ include.title }}</span>{% if include.description %}<span class="lc-desc">{{ include.description }}</span>{% endif %}<span class="lc-url">{{ include.url | split: '/' | slice: 2 | first }}</span></span></a>
