---
layout: default
---
<article class="post">
  <header class="post-hero"><div class="wrap narrow">
    <a class="back" href="{{ '/' | relative_url }}">← 記事一覧</a>
    <span class="tag">{{ page.category | default: "調査" }}</span>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%-m月%-d日" }}</time>
  </div></header>
  <div class="wrap narrow prose">{{ content }}</div>
  <div class="wrap narrow"><a class="btn btn-ghost" href="{{ '/' | relative_url }}">← ほかの記事を見る</a></div>
</article>
